spring.application.name=Silo

silo.jwt.secret=${SILO_JWT_SECRET:dev-only-secret-key-change-me-before-deploying-anywhere-32b}
silo.jwt.expiration-minutes=${SILO_JWT_EXPIRATION_MINUTES:15}
silo.jwt.refresh-expiration-days=${SILO_JWT_REFRESH_EXPIRATION_DAYS:7}

silo.loan.installment.grace-period-days=${SILO_LOAN_GRACE_PERIOD_DAYS:3}
silo.loan.consecutive-late-installments-for-default=${SILO_LOAN_CONSECUTIVE_LATE_FOR_DEFAULT:3}
silo.loan.default-penalty-rate=${SILO_LOAN_DEFAULT_PENALTY_RATE:0.05}
silo.jobs.installment-sweep-cron=${SILO_INSTALLMENT_SWEEP_CRON:0 0 1 * * *}

silo.retry.max-attempts=${SILO_RETRY_MAX_ATTEMPTS:3}
silo.retry.initial-interval-ms=${SILO_RETRY_INITIAL_INTERVAL_MS:500}
silo.retry.max-interval-ms=${SILO_RETRY_MAX_INTERVAL_MS:10000}
silo.retry.multiplier=${SILO_RETRY_MULTIPLIER:2.0}

silo.paystack.secret-key=${PAYSTACK_SECRET_KEY:dev-only-paystack-secret-change-me-before-deploying-anywhere}
silo.jobs.paystack-reconciliation-cron=${PAYSTACK_RECONCILIATION_CRON:0 30 1 * * *}
silo.paystack.reconciliation-lookback-hours=${PAYSTACK_RECONCILIATION_LOOKBACK_HOURS:48}

silo.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-only-cloud-name-change-me}
silo.cloudinary.api-key=${CLOUDINARY_API_KEY:dev-only-api-key-change-me}
silo.cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-only-api-secret-change-me}

silo.vision.api-key=${GOOGLE_VISION_API_KEY:dev-only-vision-api-key-change-me}
silo.jobs.auto-debit-sweep-cron=${AUTO_DEBIT_SWEEP_CRON:0 0 2 * * *}

# log | resend | smtp
silo.email.provider=${SILO_EMAIL_PROVIDER:smtp}
silo.resend.api-key=${RESEND_API_KEY:dev-only-resend-api-key-change-me}
silo.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Real SMTP delivery (e.g. Gmail) - no "verified domain" restriction, can send
# to any real address once SMTP_USERNAME/SMTP_PASSWORD are set to a real
# account. For Gmail, SMTP_PASSWORD must be an App Password, not your normal
# login password (needs 2-Step Verification enabled on the Google account).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
silo.smtp.from-email=${SMTP_FROM_EMAIL:dev-only-smtp-from-change-me@example.com}
silo.smtp.from-name=${SMTP_FROM_NAME:Silo Cooperative}

# Comma-separated list of origins the frontend is allowed to call the API from
silo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
