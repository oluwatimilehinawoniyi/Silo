spring.application.name=Silo

silo.jwt.secret=${SILO_JWT_SECRET:dev-only-secret-key-change-me-before-deploying-anywhere-32b}
silo.jwt.expiration-minutes=${SILO_JWT_EXPIRATION_MINUTES:15}
silo.jwt.refresh-expiration-days=${SILO_JWT_REFRESH_EXPIRATION_DAYS:7}

silo.loan.installment.grace-period-days=${SILO_LOAN_GRACE_PERIOD_DAYS:3}
silo.loan.consecutive-late-installments-for-default=${SILO_LOAN_CONSECUTIVE_LATE_FOR_DEFAULT:3}
silo.loan.default-penalty-rate=${SILO_LOAN_DEFAULT_PENALTY_RATE:0.05}
silo.jobs.installment-sweep-cron=${SILO_INSTALLMENT_SWEEP_CRON:0 0 1 * * *}

silo.retry.max-attempts=${SILO_RETRY_MAX_ATTEMPTS:3}
silo.retry.initial-interval-ms=${SILO_RETRY_INITIAL_INTERVAL_MS:500}
silo.retry.max-interval-ms=${SILO_RETRY_MAX_INTERVAL_MS:10000}
silo.retry.multiplier=${SILO_RETRY_MULTIPLIER:2.0}
